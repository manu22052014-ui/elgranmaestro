<script>
    /*
    ============================================================
    EL GRAN MAESTRO — JAVASCRIPT
    ============================================================
    */

    // =========================================================
    // 1. ENDPOINT DE FORMSPREE
    // =========================================================

    const FORM_ENDPOINT = "https://formspree.io/f/myezrqjo";


    // =========================================================
    // 2. ELEMENTOS DEL FORMULARIO
    // =========================================================

    const form = document.getElementById("contactForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusBox = document.getElementById("formStatus");


    // =========================================================
    // 3. MOSTRAR MENSAJES
    // =========================================================

    function showStatus(message, type) {

        statusBox.classList.remove(
            "hidden",
            "border-red-400/30",
            "bg-red-400/10",
            "text-red-200",
            "border-cyan-400/30",
            "bg-cyan-400/10",
            "text-cyan-100"
        );

        if (type === "error") {

            statusBox.classList.add(
                "border-red-400/30",
                "bg-red-400/10",
                "text-red-200"
            );

        } else {

            statusBox.classList.add(
                "border-cyan-400/30",
                "bg-cyan-400/10",
                "text-cyan-100"
            );
        }

        statusBox.textContent = message;
    }


    // =========================================================
    // 4. ENVÍO DEL FORMULARIO
    // =========================================================

    form.addEventListener("submit", async function(event) {

        // Evita que el navegador recargue la página
        event.preventDefault();


        // Comprueba los campos obligatorios
        if (!form.checkValidity()) {

            form.reportValidity();

            return;
        }


        // Desactiva el botón mientras se envía
        submitBtn.disabled = true;

        submitBtn.textContent = "Enviando...";


        // Recoge todos los datos del formulario
        const formData = new FormData(form);


        try {

            // Envía los datos a Formspree
            const response = await fetch(FORM_ENDPOINT, {

                method: "POST",

                body: formData,

                headers: {
                    "Accept": "application/json"
                }

            });


            // Comprueba si Formspree ha respondido correctamente
            if (!response.ok) {

                throw new Error(
                    "Error HTTP: " + response.status
                );

            }


            // Limpia el formulario
            form.reset();


            // Mensaje de éxito
            showStatus(
                "Solicitud enviada correctamente. Gracias por contactar con EL GRAN MAESTRO.",
                "success"
            );


        } catch (error) {

            console.error(
                "Error enviando el formulario:",
                error
            );


            // Mensaje de error
            showStatus(
                "No se ha podido enviar la solicitud. Inténtalo de nuevo.",
                "error"
            );


        } finally {

            // Reactiva el botón
            submitBtn.disabled = false;

            submitBtn.textContent = "Enviar solicitud →";
        }

    });


    // =========================================================
    // 5. ANIMACIONES AL HACER SCROLL
    // =========================================================

    const observer = new IntersectionObserver(

        function(entries) {

            entries.forEach(function(entry) {

                if (entry.isIntersecting) {

                    entry.target.classList.add("visible");

                    observer.unobserve(entry.target);
                }

            });

        },

        {
            threshold: 0.12
        }

    );


    // Busca todos los elementos que tengan la clase "reveal"
    document.querySelectorAll(".reveal").forEach(function(element) {

        observer.observe(element);

    });


    // =========================================================
    // 6. SCROLL SUAVE PARA LOS ENLACES
    // =========================================================

    document.querySelectorAll('a[href^="#"]').forEach(function(link) {

        link.addEventListener("click", function(event) {

            const targetId = this.getAttribute("href");

            const target = document.querySelector(targetId);


            if (target) {

                event.preventDefault();

                target.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

            }

        });

    });


    // =========================================================
    // 7. MENSAJE EN CONSOLA
    // =========================================================

    console.log(
        "EL GRAN MAESTRO — Landing Page cargada correctamente."
    );

</script>
